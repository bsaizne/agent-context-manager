[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-manager"
version = "0.9.0"
description = "Local project context handoff manager for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "bsaizne" }
]
keywords = ["agent", "context", "cli", "handoff", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13,<15",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
package = [
  "pyinstaller>=6",
]
gui = [
  "PySide6>=6.7,<7",
]

[project.scripts]
agent-context = "agent_context.cli:main"
agent-context-gui = "agent_context.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
