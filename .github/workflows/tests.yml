name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test,gui]"
      - name: Test
        run: pytest -q

  cli-only:
    name: Linux / CLI only / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        # The GUI tests need PySide6 plus an X/OpenGL stack that is not worth installing
        # here; the Windows job covers them. Linux and macOS users who want the GUI can
        # install the gui extra locally and run the full suite.
        run: pytest -q --ignore=tests/test_gui_bootstrap_prompt.py
